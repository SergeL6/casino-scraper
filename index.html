<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Casino Bonuses</title>
  <style>
    body { font-family: system-ui, sans-serif; margin: 16px; }
    .wrap { overflow-x: auto; }
    table { border-collapse: collapse; width: 100%; min-width: 480px; }
    th, td { border: 1px solid #ccc; padding: 8px; text-align: left; vertical-align: top; }
    th { background: #f2f2f2; }
    .muted { color: #777; }
    #updated { font-size: 0.85em; color: #555; }
  </style>
</head>
<body>
  <h1>Casino welcome bonuses</h1>
  <p id="updated"></p>
  <div class="wrap">
    <table>
      <thead>
        <tr>
          <th>Casino</th>
          <th>Welcome bonus</th>
          <th>Wagering (x)</th>
          <th>Min. deposit</th>
          <th>Source</th>
        </tr>
      </thead>
      <tbody id="rows"></tbody>
    </table>
  </div>

  <script>
    function cell(tr, value, fallback) {
      const td = document.createElement("td");
      if (value === null || value === undefined) {
        td.textContent = fallback;
        td.className = "muted";
      } else {
        td.textContent = value;
      }
      tr.appendChild(td);
      return td;
    }

    fetch("data.json")
      .then(r => r.json())
      .then(data => {
        document.getElementById("updated").textContent =
          "Last updated: " + new Date(data.scraped_at).toLocaleString();
        const tbody = document.getElementById("rows");
        data.casinos.forEach(c => {
          const tr = document.createElement("tr");
          cell(tr, c.casino, "-");
          cell(tr, c.welcome_bonus, "-");
          cell(tr, c.wagering_multiplier, "Not stated");
          cell(tr, c.min_deposit, "Not stated");
          const td = document.createElement("td");
          const a = document.createElement("a");
          a.href = c.source_url;
          a.textContent = "Source";
          td.appendChild(a);
          tr.appendChild(td);
          tbody.appendChild(tr);
        });
      })
      .catch(() => {
        document.getElementById("updated").textContent = "Could not load data.json";
      });
  </script>
</body>
</html>
